<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Opiskelut">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Opiskelut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Aina tumma. Yksi rohkea elementti: lähtölaskentakortti isoilla tiiviillä numeroilla. */
  --bg:#0b0d0f; --card:#15181b; --ink:#eef0ee; --soft:#a2aaaf; --faint:#69737a; --line:#22272b;
  --hero:#1b2024; --hero-ink:#f4f5f2; --hero-soft:#95a0a6;
  --accent:#7b93ff; --uni:#7b93ff; --vamk:#f06595;
  --red:#ff6b57; --orange:#ffa94d; --yellow:#f2c94c; --green:#51cf8a;
  --red-bg:#3a1c18; --tint:#1c2240;
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
main{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.hello{font-weight:700;font-size:22px;letter-spacing:-.01em}
.date{color:var(--soft);font-size:14px}
.sync{color:var(--faint);font-size:12px;margin-top:2px}
.sync.err{color:var(--orange)}

/* HERO */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:20px 20px 18px;position:relative;overflow:hidden}
.hero .lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-soft);display:flex;gap:8px;align-items:center}
.hero .lbl i{width:8px;height:8px;border-radius:50%;background:var(--u,var(--green));display:inline-block}
.count{font:900 92px/0.86 var(--display);letter-spacing:-.01em;margin:14px 0 4px;display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums;color:var(--u,var(--hero-ink))}
.count small{font:800 30px var(--display);color:var(--hero-soft);letter-spacing:.02em;margin-right:6px}
.hero h2{font:700 21px/1.2 var(--body);margin:10px 0 4px;text-wrap:balance}
.hero .sub{color:var(--hero-soft);font-size:14px}
.hero .acts{display:flex;gap:8px;margin-top:16px}
.hbtn{border:0;border-radius:99px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;background:var(--hero-ink);color:var(--hero);text-decoration:none;display:inline-flex;align-items:center}
.hbtn.ghost{background:transparent;color:var(--hero-ink);box-shadow:inset 0 0 0 1.5px #ffffff33}
.hero .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--u,var(--green));width:var(--p,30%)}
@media (prefers-reduced-motion:no-preference){.hero{animation:rise .5s cubic-bezier(.2,.8,.2,1)} @keyframes rise{from{transform:translateY(8px)}to{transform:none}}}

/* SECTIONS */
section{margin-top:26px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px}
.sh h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.sh button{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;padding:0}
.box{background:var(--card);border-radius:var(--r);overflow:hidden}
.empty{color:var(--faint);padding:16px;font-size:15px}

/* TIMELINE */
.tl{padding:6px 0}
.tli{display:grid;grid-template-columns:62px 14px 1fr;gap:0 10px;padding:10px 16px 10px 14px;align-items:start}
.tli .t{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;text-align:right;line-height:1.25}
.tli .t span{display:block;color:var(--faint);font-weight:500;font-size:12.5px}
.tli .rail{position:relative;align-self:stretch;display:flex;justify-content:center}
.tli .rail::before{content:"";position:absolute;top:0;bottom:-20px;width:2px;background:var(--line)}
.tli:last-child .rail::before{bottom:auto;height:12px}
.tli .dot{position:relative;width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--card);box-shadow:inset 0 0 0 3px var(--c,var(--uni))}
.tli.now .dot{background:var(--c,var(--uni))}
.tli.past{opacity:.45}
.tli .n{font-weight:600;line-height:1.3}
.tli .m{color:var(--soft);font-size:13.5px;margin-top:1px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}
.tag.now{background:var(--c,var(--uni));color:#fff}
.tag.exam{background:var(--red-bg);color:var(--red)}
.tli.exam .n{color:var(--red)}

/* ROWS */
.row{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row .ud{width:10px;height:10px;border-radius:50%;background:var(--u,var(--faint))}
.row .n{font-weight:600;line-height:1.3}
.row .m{color:var(--soft);font-size:13.5px;margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .r{text-align:right;white-space:nowrap}
.row .r b{display:block;font:800 22px/1 var(--display);color:var(--u,var(--ink));font-variant-numeric:tabular-nums;letter-spacing:.01em}
.row .r span{font-size:12.5px;color:var(--faint)}
.row.done .n{text-decoration:line-through;color:var(--faint)}
.row.done .ud{background:var(--green)}
.sch{font-size:11.5px;font-weight:700;color:var(--uni)}
.sch.vamk{color:var(--vamk)}
.req{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;white-space:nowrap}
.req.must{background:var(--red-bg);color:var(--red)}
.req.pts{background:var(--tint);color:var(--accent)}
.req.opt{color:var(--soft);box-shadow:inset 0 0 0 1.2px var(--line)}
.req.unk{color:var(--faint);box-shadow:inset 0 0 0 1.2px var(--line);border:1px dashed transparent}
.hero .req{vertical-align:2px;margin-left:8px}
.hero .req.opt,.hero .req.unk{color:var(--hero-soft);box-shadow:inset 0 0 0 1.2px #ffffff33}
.det{padding:0 16px 16px 38px;color:var(--soft);font-size:14.5px;display:grid;gap:10px}
.det p{margin:0;max-width:60ch}
.det .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:99px;padding:9px 15px;font-weight:700;font-size:14px;cursor:pointer;background:var(--ink);color:var(--bg);text-decoration:none}
.btn.line{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ok{background:var(--green);color:#fff}

/* SEGMENTED + WEEK */
.seg{display:flex;background:var(--card);border-radius:99px;padding:4px;gap:2px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ptitle{font:900 44px/1 var(--display);letter-spacing:.005em;margin:6px 4px 16px;text-transform:uppercase}
.wk{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
.wk b{font-weight:700}
.wk .nav{display:flex;gap:6px}
.wk .nav button{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);cursor:pointer;font-size:18px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.days.seven{grid-template-columns:repeat(7,1fr)}
.days button{border:0;background:var(--card);border-radius:14px;padding:9px 0 8px;cursor:pointer;display:grid;gap:2px;justify-items:center}
.days button small{font-size:12px;color:var(--soft);font-weight:600;text-transform:uppercase}
.days button b{font:800 24px/1 var(--display)}
.days button i{width:5px;height:5px;border-radius:50%;background:var(--faint);opacity:var(--o,0)}
.days button.ex i{background:var(--red);opacity:1}
.days button.today small{color:var(--accent)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.days button[aria-pressed="true"] small{color:var(--bg);opacity:.7}

/* REG */
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--tint);color:var(--accent);white-space:nowrap}
.pill.hot{background:var(--red-bg);color:var(--red)}
.pill.ok{background:none;color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}
.pill.mute{background:none;color:var(--faint);box-shadow:inset 0 0 0 1.5px var(--line)}

.notice{padding:14px 16px;border-top:1px solid var(--line);font-size:14.5px}
.notice:first-child{border-top:0}
.notice .m{color:var(--faint);font-size:12.5px;margin-bottom:3px}

/* PIN */
.lock{min-height:80vh;display:grid;place-content:center;gap:18px;text-align:center}
.lock h1{font:900 64px/0.9 var(--display);margin:0;text-transform:uppercase}
.lock p{color:var(--soft);margin:0}
.lock input{font:800 34px var(--display);letter-spacing:.3em;text-align:center;background:var(--card);color:var(--ink);border:0;border-radius:16px;padding:14px;width:220px;justify-self:center}
.lock .err{color:var(--red);min-height:1.2em;font-size:14px}
/* NAV */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:4px;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:99px;padding:6px;box-shadow:0 10px 30px #0003}
nav button{border:0;background:none;color:var(--bg);opacity:.6;border-radius:99px;padding:9px 11px;font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
nav button svg{width:19px;height:19px;flex:none}
nav button[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}
nav button:not([aria-selected="true"]) span{display:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="main"><div class="lock"><h1>Opiskelut</h1><p>Ladataan…</p></div></main>
<nav role="tablist" aria-label="Näkymät">
  <button role="tab" id="t-koti" data-v="koti" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Koti</span></button>
  <button role="tab" id="t-dl" data-v="dl" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span>Deadlinet</span></button>
  <button role="tab" id="t-lk" data-v="lk" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Lukkari</span></button>
  <button role="tab" id="t-il" data-v="il" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h9"/></svg><span>Ilmot</span></button>
  <button role="tab" id="t-pt" data-v="pt" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Pisteet</span></button>
  <button role="tab" id="t-tg" data-v="tg" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 4.5L2.8 11.6c-.9.4-.9 1.6 0 1.9l4.6 1.5 1.8 5.5c.3.8 1.3 1 1.9.4l2.6-2.5 4.9 3.6c.7.5 1.7.1 1.9-.7l3-15.4c.2-1-.8-1.8-1.9-1.4z"/><path d="M7.4 15l10-7.5"/></svg><span>Telegram</span></button>
</nav>
<script>
const SNAPSHOT = {deadlines:[],lessons:[],registrations:[],notices:[]};
const EXTRA0 = {};
const GRADES0 = {courses:[]};
let TG = {items:[]}, BASE = SNAPSHOT, EXTRA = EXTRA0, GRADES = GRADES0, DATA = null, DONE = {}, doneRef = null, canWrite = true, syncMsg = "", syncErr = false;
function merge(){
  const b = BASE||{}, e = EXTRA||{};
  const ids = new Set((e.deadlines||[]).map(x=>x.id));
  const exk = x => x.type==="tentti" ? x.course+"|"+String(x.due).slice(0,10) : null;
  const exams = new Set((e.deadlines||[]).map(exk).filter(Boolean));
  const lk = l => l.date+"|"+(l.start||"")+"|"+(l.title||"").split(/[ ,–-]/)[0];
  const lks = new Set((e.lessons||[]).map(lk));
  DATA = {...b,
    deadlines: [...(b.deadlines||[]).filter(x=>!ids.has(x.id) && !exams.has(exk(x))), ...(e.deadlines||[])],
    lessons: [...(b.lessons||[]).filter(l=>!lks.has(lk(l))), ...(e.lessons||[])],
    registrations: [...(b.registrations||[]), ...(e.registrations||[])],
    notices: [...(b.notices||[]), ...(e.notices||[])]};
}
merge();
const VIEWS = ["koti","dl","lk","il","pt","tg"];
let view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "koti";
let filter = "kaikki", showDone = false, open = null, weekOff = 0, selDay = null;
const $m = document.getElementById("main");
const WD = ["su","ma","ti","ke","to","pe","la"], WDL = ["sunnuntai","maanantai","tiistai","keskiviikko","torstai","perjantai","lauantai"];
const MON = ["tammikuuta","helmikuuta","maaliskuuta","huhtikuuta","toukokuuta","kesäkuuta","heinäkuuta","elokuuta","syyskuuta","lokakuuta","marraskuuta","joulukuuta"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dshort = d => `${WD[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.`;
const hm = d => `${d.getHours()}.${String(d.getMinutes()).padStart(2,"0")}`;
const tfmt = s => s ? s.replace(/^0/,"").replace(":",".") : "";
const now = () => Date.now();
function urg(ms){ const h = ms/36e5; return h < 24 ? "var(--red)" : h < 72 ? "var(--orange)" : h < 168 ? "var(--yellow)" : "var(--faint)"; }
function rel(ms){ if (ms < 0) return {big:"0", unit:"min"}; const m = ms/6e4, h = m/60, d = h/24;
  if (h < 1) return {big:String(Math.max(1,Math.round(m))), unit:"min"};
  if (h < 48) return {big:String(Math.floor(h)), unit:"h"};
  return {big:String(Math.floor(d)), unit:"pv"}; }
function schChip(s){ return `<span class="sch ${s==="VAMK"?"vamk":""}">${esc(s==="VAMK"?"VAMK":"UWASA")}</span>`; }
const REQ = {must:["must","Pakollinen"], pts:["pts","Antaa pisteitä"], opt:["opt","Vapaaehtoinen"], flex:["opt","Joustava"], rec:["opt","Suositus"], ifneed:["opt","Tarvittaessa"], unk:["unk","Ei tiedossa"]};
const REQWHY = {
  must:"Pakollinen kurssin läpäisyyn.",
  pts:"Ei yksinään pakollinen, mutta antaa pisteitä, jotka vaikuttavat läpäisyyn tai arvosanaan. Katso Pisteet-välilehti.",
  opt:"Vapaaehtoinen, ei vaikuta arvosanaan.",
  flex:"Itse tehtävä on pakollinen, mutta voit palauttaa sen myös myöhempään palautuserään (viimeistään 31.5.2027).",
  rec:"Opettajan suositusaika. Varsinainen takaraja on myöhemmin.",
  ifneed:"Vain jos tarvitset uusintaa.",
  unk:"Kurssisivulta ei selvinnyt, onko tämä pakollinen. Tarkista opettajalta tai kurssin ohjeista."};
function reqOf(x){
  if (x.req && REQ[x.req]) return x.req;
  const t = (x.title||"") + " " + (x.note||""), c = x.course||"";
  if (/suositus/i.test(t)) return "rec";
  if (/uusinta/i.test(t)) return /Teknillisen matematiikan/.test(c) ? "must" : "ifneed";
  if (x.type==="tentti" || /koe\b|lopputentti/i.test(t)) return "must";
  if (/Digitaalitekniikka/.test(c) && /Lopputesti|Ennakkotentti/i.test(t)) return "pts";
  if (/Lineaarialgebra/.test(c) && /Lisäteht/i.test(t)) return "opt";
  if (/Mekaniikka/.test(c) && /Kertausteht/i.test(t)) return "pts";
  if (/Tietokone työvälineenä/.test(c)) return /Viimeinen/i.test(t) ? "must" : "flex";
  if (/raportti|mittauspöytäkirja|käytäntötentti|vertaisarvio|laboratorioraportit/i.test(t)) return "must";
  return "unk";
}
const reqChip = x => { const r = REQ[reqOf(x)]; return `<span class="req ${r[0]}">${r[1]}</span>`; };
const deadlines = () => (DATA.deadlines||[]).filter(x => new Date(x.due) > now() - 2*36e5).sort((a,b)=>new Date(a.due)-new Date(b.due));
const lessonsOn = k => (DATA.lessons||[]).filter(l=>l.date===k).sort((a,b)=>(a.start||"99").localeCompare(b.start||"99"));
function regState(r){
  if (DONE[r.id]) return {txt:"Ilmoittauduttu", cls:"ok", sort:9e15};
  if (!r.closes) return {txt:"Ei ilmoa", cls:"mute", sort:8e15};
  const c = new Date(r.closes), o = r.opens ? new Date(r.opens) : null;
  if (c < now()) return {txt:"Päättynyt", cls:"mute", sort:7e15};
  if (o && o > now()) return {txt:`Aukeaa ${o.getDate()}.${o.getMonth()+1}.`, cls:"", sort:+o};
  const days = Math.ceil((c-now())/864e5);
  return {txt: days <= 1 ? "Sulkeutuu tänään" : `Auki · ${days} pv`, cls: days <= 7 ? "hot" : "", sort:+c, openNow:true};
}

function hero(){
  const up = deadlines().filter(x=>!DONE[x.id] && new Date(x.due) > now());
  const x = up[0];
  if (!x) return `<div class="hero"><div class="lbl"><i></i>Ei tulevia deadlineja</div><div class="count">0<small>kpl</small></div><h2>Kaikki tehty. Hyvä!</h2></div>`;
  const ms = new Date(x.due) - now(), d = new Date(x.due), h = ms/36e5;
  const u = urg(ms).replace("var(--faint)","var(--hero-ink)");
  let big;
  if (h < 1) big = `${Math.max(1,Math.round(ms/6e4))}<small>min</small>`;
  else if (h < 24) big = `${Math.floor(h)}<small>h</small>${Math.floor((ms%36e5)/6e4)}<small>min</small>`;
  else big = `${Math.floor(h/24)}<small>pv</small>${Math.floor(h%24)}<small>h</small>`;
  const p = Math.max(6, Math.min(100, 100 - (h/(14*24))*100));
  return `<div class="hero" style="--u:${u};--p:${p}%">
    <div class="lbl"><i></i>Seuraava ${x.type==="tentti"?"tentti":"deadline"}</div>
    <div class="count">${big}</div>
    <h2>${esc(x.title)}${reqChip(x)}</h2>
    <div class="sub">${esc(x.course)} · ${dshort(d)} klo ${hm(d)}</div>
    <div class="acts">${canWrite?`<button class="hbtn" data-done="${esc(x.id)}">Merkitse tehdyksi</button>`:""}${x.url?`<a class="hbtn ghost" href="${esc(x.url)}" target="_blank" rel="noopener">Avaa</a>`:""}</div>
    <div class="bar"></div></div>`;
}
function timeline(list, k){
  const isToday = k === key(new Date()); const nowHM = new Date().toTimeString().slice(0,5);
  let seenNext = false;
  return `<div class="box tl">${list.map(l=>{
    const c = l.kind==="tentti" ? "var(--red)" : l.school==="VAMK" ? "var(--vamk)" : "var(--uni)";
    let cls = "", tag = "";

let BLOB = null, locked = false;
async function fetchBlob(){
  try { const r = await fetch("data.enc.json?t=" + Date.now(), {cache:"no-store"}); if(!r.ok) throw 0; BLOB = await r.json(); try{ localStorage.setItem("blob", JSON.stringify(BLOB)); }catch(_){} syncMsg=""; syncErr=false; }
  catch(_){ try{ BLOB = JSON.parse(localStorage.getItem("blob")||"null"); }catch(__){} syncMsg = "offline"; syncErr = !BLOB; }
}
async function unlock(pin){
  const all = await decrypt(pin, BLOB);
  BASE = all.data || BASE; EXTRA = all.extra || {}; GRADES = all.grades || GRADES; TG = all.telegram || {items:[]}; merge();
  try{ localStorage.setItem("pin", pin); }catch(_){}
  locked = false; render();
}
function lockScreen(msg){
  locked = true; document.querySelector("nav").style.display="none";
  $m.innerHTML = `<form class="lock" id="lock"><h1>Opiskelut</h1><p>Syötä PIN-koodi</p><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="12" aria-label="PIN-koodi"><div class="err">${esc(msg||"")}</div><button class="btn" style="justify-self:center;padding:12px 28px">Avaa</button></form>`;
  const f = document.getElementById("lock"), inp = document.getElementById("pin"); inp.focus();
  f.addEventListener("submit", async e => { e.preventDefault(); try { await unlock(inp.value.trim()); document.querySelector("nav").style.display=""; } catch(_) { lockScreen("Väärä PIN"); } });
}
const _render = render;
render = function(){ if (!locked) _render(); };
(async () => {
  await fetchBlob();
  if (!BLOB){ $m.innerHTML = '<div class="lock"><h1>Opiskelut</h1><p>Tietoja ei saatu ladattua. Tarkista nettiyhteys.</p></div>'; return; }
  let pin = null; try{ pin = localStorage.getItem("pin"); }catch(_){}
  if (pin){ try { await unlock(pin); } catch(_) { lockScreen(); } } else lockScreen();
})();
document.addEventListener("visibilitychange", async () => { if (document.visibilityState==="visible" && !locked){ await fetchBlob(); try{ await unlock(localStorage.getItem("pin")); }catch(_){} } });
setInterval(()=>{ if(!locked && (view==="koti"||view==="dl")) render(); }, 60000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
